<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>SyncUp Reports</title>
  <style>
    :root { color-scheme: dark; --bg: #080808; --panel: #111; --line: #2b2b2b; --text: #f5f5f0; --muted: #9a9a94; --accent: #d8ff3e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 0%, #262a18, transparent 35%), var(--bg); color: var(--text); font: 15px/1.5 DM Sans, sans-serif; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
    h1 { margin: 0; font: 48px/1 Instrument Serif, Georgia, serif; }
    p { color: var(--muted); margin: 8px 0 0; }
    form { display: flex; gap: 8px; }
    input, button { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 11px 13px; border-radius: 4px; font: inherit; }
    button { background: var(--accent); border-color: var(--accent); color: #080808; cursor: pointer; font-weight: 700; }
    .status { min-height: 24px; color: var(--muted); margin: 20px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .card { border: 1px solid var(--line); background: rgba(17,17,17,.86); padding: 18px; }
    h2 { font-size: 14px; letter-spacing: .12em; margin: 0 0 16px; color: var(--accent); }
    .metric { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding: 10px 0; }
    .metric span { color: var(--muted); }
    .metric strong { font-size: 20px; }
    @media (max-width: 680px) { header { display: block; } form { margin-top: 20px; } input { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>SyncUp Reports</h1><p>12-hour activity and lifetime totals</p></div>
      <form id="login-form"><input id="token" type="password" placeholder="Dashboard token" autocomplete="off" required><button>View reports</button></form>
    </header>
    <div class="status" id="status">Enter your dashboard token to load reports.</div>
    <section class="grid" id="report-grid" aria-live="polite"></section>
  </main>
  <script>
    const groups = ['TA', 'SDE', 'DATA', 'SALES', 'DESIGN', 'FREELANCE', 'FOUNDERS'];
    const grid = document.getElementById('report-grid');
    const status = document.getElementById('status');
    let dashboardToken = '';

    function render(report) {
      const cards = groups.map((group) => {
        const visits = report.find((row) => row.community === group && row.event_type === 'website_visit');
        const joins = report.find((row) => row.community === group && row.event_type === 'join_click');
        return `<article class="card"><h2>${group} COMMUNITY</h2><div class="metric"><span>Visits / 12h</span><strong>${visits?.latest_count || 0}</strong></div><div class="metric"><span>Joins / 12h</span><strong>${joins?.latest_count || 0}</strong></div><div class="metric"><span>Total visits</span><strong>${visits?.total_count || 0}</strong></div><div class="metric"><span>Total joins</span><strong>${joins?.total_count || 0}</strong></div></article>`;
      }).join('');
      grid.innerHTML = cards;
      status.textContent = `Updated ${new Date().toLocaleString()}. Refreshes every 5 minutes.`;
    }

    async function loadReports() {
      status.textContent = 'Loading reports...';
      const response = await fetch('/api/dashboard', { headers: { 'x-dashboard-token': dashboardToken } });
      if (!response.ok) throw new Error(response.status === 401 ? 'Invalid dashboard token.' : 'Could not load reports.');
      render(await response.json());
    }

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      dashboardToken = document.getElementById('token').value;
      try { await loadReports(); } catch (error) { status.textContent = error.message; }
    });

    setInterval(() => { if (dashboardToken) loadReports().catch((error) => { status.textContent = error.message; }); }, 300000);
  </script>
</body>
</html>
